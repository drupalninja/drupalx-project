$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Card
description: 'Image- or icon-led spark-card with wayfinding color bar. Child of the Card grid slot.'
status: stable
group: DrupalX Sections

props:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      title: Title
      examples:
        - 'Community development'
    body:
      type: string
      title: Body
      contentMediaType: text/html
      x-formatting-context: block
      default: ''
      examples:
        - '<p>Grants, planning, and technical assistance.</p>'
    url:
      type: string
      format: uri-reference
      title: Link
      default: ''
      examples:
        - /services
    image:
      type: object
      title: Image
      $ref: 'json-schema-definitions://canvas.module/image'
      examples:
        - src: 'https://placehold.co/1600x1000'
          alt: 'Placeholder image'
      default: ''
    icon:
      type: string
      title: Icon
      description: 'Lucide icon shown when there is no image; ''none'' hides it.'
      default: none
      enum:
        - none
        - arrow-right
        - arrow-up-right
        - chart-column
        - building-2
        - calendar
        - check
        - chevron-down
        - chevron-right
        - clock
        - download
        - external-link
        - file-text
        - flag
        - folder
        - globe
        - graduation-cap
        - heart-handshake
        - info
        - landmark
        - leaf
        - library
        - lightbulb
        - mail
        - map
        - map-pin
        - megaphone
        - menu
        - newspaper
        - phone
        - search
        - shield-check
        - sparkles
        - star
        - triangle-alert
        - users
        - x
    image_fit:
      type: string
      title: 'Image fit'
      description: >-
        Contain (the default) scales the whole image into the slot and
        letterboxes it against the card tint — the safe choice for IMPORTED
        imagery, which is often a logo or a scanned form. Choose Cover only for
        a grid of CHOSEN photographs, where filling the slot edge to edge is
        what makes the row read image-led.
      default: contain
      enum:
        - contain
        - cover
      meta:enum:
        contain: 'Contain (safe for imported imagery)'
        cover: 'Cover (chosen photography)'
    placeholder:
      type: boolean
      title: 'Branded placeholder tile'
      description: >-
        Show a branded tile in the image slot when this card has no image. Turn
        it on only in a grid where OTHER cards do have images, so the row keeps
        one rhythm — a grid where no card has an image reads better with the
        icon chip, which is what you get with this off.
      default: false
    c:
      type: string
      title: 'Wayfinding color'
      default: none
      enum:
        - none
        - sky
        - clay
        - accent
      meta:enum:
        none: 'Primary (default)'
        sky: Sky
        clay: Clay
        accent: Accent
    more_label:
      type: string
      title: 'Read-more label'
      default: 'Learn more'
    style:
      type: string
      title: 'Card style'
      description: >-
        Feature is the tall dark photo card that anchors a Bento card grid —
        put it FIRST in the slot and set the grid''s Layout to Bento, which is
        what makes it span two rows.
      default: default
      enum:
        - default
        - feature
      meta:enum:
        default: 'Default (light spark-card)'
        feature: 'Feature (tall dark photo card, for Bento grids)'
    stat:
      type: string
      title: 'Stat — number'
      description: 'Optional big number on a Feature card. Ignored by the default style.'
      default: ''
      examples:
        - '$75M+'
    stat_label:
      type: string
      title: 'Stat — label'
      default: ''
      examples:
        - 'in awards secured'
