$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Section: Hero'
description: 'Homepage hero — glass panel over photo, light editorial split with offset photo card + floating stat chip, or solid dark band. One per page, at the top.'
status: stable
group: DrupalX Sections

props:
  type: object
  required:
    - title
  properties:
    eyebrow:
      type: string
      title: Eyebrow
      default: ''
      examples:
        - 'Welcome to Anytown'
    title:
      type: string
      title: Title
      examples:
        - 'A community connected'
    body:
      type: string
      title: Body
      description: Short lede paragraph under the title.
      contentMediaType: text/html
      x-formatting-context: block
      default: ''
      examples:
        - '<p>Serving our region since 1968.</p>'
    image:
      type: object
      title: Image
      $ref: 'json-schema-definitions://canvas.module/image'
      examples:
        - src: 'https://placehold.co/1600x1000'
          alt: 'Placeholder image'
      default: ''
    style:
      type: string
      title: 'Hero style'
      default: split
      enum:
        - glass
        - split
        - dark
      meta:enum:
        glass: 'Glass panel over full-bleed photo'
        split: 'Light editorial split (photo card + offset frame)'
        dark: 'Solid dark band (no photo needed)'
      examples:
        - split
    height:
      type: string
      title: Height
      description: 'Capped heights (never raw vh — the Canvas editor iframe is unbounded).'
      default: medium
      enum:
        - short
        - medium
        - tall
      meta:enum:
        short: Short
        medium: Medium
        tall: Tall
    stat_chip_number:
      type: string
      title: 'Stat chip — number'
      description: 'Optional floating stat chip on the photo card (split style only).'
      default: ''
      examples:
        - '$215M+'
    stat_chip_label:
      type: string
      title: 'Stat chip — label'
      default: ''
      examples:
        - 'invested in the region'

slots:
  hero_buttons:
    title: Buttons
    description: 'Button components rendered under the hero copy.'
