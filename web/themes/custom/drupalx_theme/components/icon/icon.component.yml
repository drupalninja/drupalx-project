$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Icon
description: 'Inline Lucide icon (build-time SVG from the theme''s curated set in dist/icons — no CDN, no client JS). Color inherits currentColor.'
status: stable
group: DrupalX Primitives

props:
  type: object
  properties:
    name:
      type: string
      title: Icon
      description: 'Lucide icon name from the curated set (scripts/copy-icons.mjs). Use ''none'' to render nothing — never an empty string (Canvas rejects empty enum values).'
      default: none
      enum:
        - none
        - arrow-right
        - arrow-up-right
        - briefcase
        - building
        - building-2
        - bus
        - calendar
        - car
        - chart-column
        - check
        - chevron-down
        - chevron-right
        - circle-check-big
        - clipboard-check
        - clock
        - dollar-sign
        - download
        - droplet
        - external-link
        - factory
        - file-text
        - flag
        - flask-conical
        - folder
        - git-branch
        - globe
        - graduation-cap
        - heart-handshake
        - house
        - info
        - landmark
        - layers
        - leaf
        - library
        - life-buoy
        - lightbulb
        - mail
        - map
        - map-pin
        - megaphone
        - menu
        - newspaper
        - paw-print
        - pen-line
        - phone
        - play
        - rocket
        - search
        - send
        - shield-check
        - sparkles
        - sprout
        - star
        - trash
        - triangle-alert
        - users
        - wifi
        - x
        - zap
      examples:
        - map-pin
    size:
      type: string
      title: Size
      default: md
      enum:
        - sm
        - md
        - lg
      meta:enum:
        sm: 'Small (16px)'
        md: 'Medium (24px)'
        lg: 'Large (40px)'
      examples:
        - md
