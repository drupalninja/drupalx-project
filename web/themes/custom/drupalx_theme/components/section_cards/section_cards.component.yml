$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Section: Card grid'
description: 'spark-card grid with wayfinding color bars and optional 2x featured first card (bento). Fill the cards slot with Card components.'
status: stable
group: DrupalX Sections

props:
  type: object
  properties:
    eyebrow:
      type: string
      title: Eyebrow
      default: ''
    title:
      type: string
      title: Title
      default: ''
      examples:
        - 'What we do'
    lede:
      type: string
      title: Lede
      contentMediaType: text/html
      x-formatting-context: block
      default: ''
    columns:
      type: string
      title: Columns
      default: '3'
      enum:
        - '2'
        - '3'
        - '4'
      meta:enum:
        '2': '2 columns'
        '3': '3 columns'
        '4': '4 columns'
    tone:
      type: string
      title: Background
      default: white
      enum:
        - white
        - tint
      meta:enum:
        white: White
        tint: 'Primary tint'
    featured_first:
      type: boolean
      title: 'Feature the first card (2x width)'
      default: false
    layout:
      type: string
      title: Layout
      description: >-
        Bento breaks the uniform matrix: the FIRST card is TWO ROWS TALL (set
        that card''s style to Feature) and the compact cards fill the columns
        beside it. Use an EVEN number of compact cards — four fills the grid
        exactly; an odd number leaves one empty cell. Ignores Columns and
        Feature-the-first-card.
      default: grid
      enum:
        - grid
        - bento
      meta:enum:
        grid: 'Grid (even columns)'
        bento: 'Bento (first card 2x2, rest compact)'
    paginate:
      type: boolean
      title: 'Paginate this grid'
      description: >-
        Chunk the grid into pages. Leave off for an editor-composed grid of a
        few cards; turn it on for an imported grid that runs to dozens. Every
        card is still rendered server-side, so search engines and the site
        search see the whole list.
      default: false
    per_page:
      type: integer
      title: 'Cards per page'
      description: '12 keeps 3-up rows whole. Only applies when Paginate is on.'
      default: 12

slots:
  cards:
    title: Cards
    description: 'Card / News card / Event card components.'
