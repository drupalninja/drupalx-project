$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Spacer
description: 'Vertical space between components.'
status: stable
group: DrupalX Primitives

props:
  type: object
  properties:
    size:
      type: string
      title: Size
      default: md
      enum:
        - sm
        - md
        - lg
        - xl
      meta:enum:
        sm: 'Small (2rem)'
        md: 'Medium (3.5rem)'
        lg: 'Large (5rem)'
        xl: 'Extra large (7rem)'
